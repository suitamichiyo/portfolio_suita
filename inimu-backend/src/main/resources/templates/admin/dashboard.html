<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>管理ダッシュボード | inimu</title>
  <style>
    body { font-family: 'Noto Sans JP', sans-serif; background: #F7F7F5;
           margin: 0; padding: 0; font-size: 13px; }
    header { background: #1A1A1A; color: white; padding: 16px 32px;
             display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 16px; margin: 0; }
    header a { color: rgba(255,255,255,0.7); font-size: 12px; text-decoration: none; }
    main { padding: 32px; max-width: 1200px; margin: 0 auto; }
    h2 { font-size: 16px; margin: 32px 0 16px; border-bottom: 0.5px solid #E0E0E0; padding-bottom: 8px; }
    table { width: 100%; border-collapse: collapse; background: white;
            border: 0.5px solid #E0E0E0; border-radius: 4px; }
    th { background: #F7F7F5; padding: 10px 12px; text-align: left;
         font-size: 11px; color: #888; border-bottom: 0.5px solid #E0E0E0; }
    td { padding: 10px 12px; border-bottom: 0.5px solid #E0E0E0; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    .status { font-size: 11px; padding: 3px 8px; border-radius: 2px; }
    .status-confirmed { background: #E8F5E9; color: #2E7D32; }
    .status-cancelled { background: #FFEBEE; color: #C62828; }
    .status-unread { background: #FFF3E0; color: #E65100; }
    .status-read { background: #F5F5F5; color: #888; }
    form.inline { display: inline; }
    select { font-size: 11px; padding: 4px; border: 0.5px solid #E0E0E0; border-radius: 2px; }
    button.small { font-size: 11px; padding: 4px 10px; background: #1A1A1A;
                   color: white; border: none; border-radius: 2px; cursor: pointer; margin-left: 4px; }
  </style>
</head>
<body>
<header>
  <h1>inimu 管理ダッシュボード</h1>
  <a th:href="@{/admin/logout}" onclick="return confirm('ログアウトしますか？')">ログアウト</a>
</header>
<main>
  <h2>予約一覧</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th><th>日程</th><th>時間</th><th>氏名</th>
        <th>人数</th><th>メール</th><th>電話</th><th>ステータス</th><th>操作</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="r : ${reservations}">
        <td th:text="${r.id}"></td>
        <td th:text="${r.slot_date}"></td>
        <td th:text="${r.start_time} + '〜' + ${r.end_time}"></td>
        <td th:text="${r.name}"></td>
        <td th:text="${r.num_people} + '名'"></td>
        <td th:text="${r.email}"></td>
        <td th:text="${r.phone}"></td>
        <td>
          <span class="status"
                th:classappend="${r.status == 'CONFIRMED'} ? 'status-confirmed' : 'status-cancelled'"
                th:text="${r.status}"></span>
        </td>
        <td>
          <form class="inline" th:action="@{/admin/reservations/{id}/status(id=${r.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <select name="status">
              <option value="CONFIRMED" th:selected="${r.status == 'CONFIRMED'}">CONFIRMED</option>
              <option value="CANCELLED" th:selected="${r.status == 'CANCELLED'}">CANCELLED</option>
            </select>
            <button class="small" type="submit">更新</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>

  <h2>お問い合わせ一覧</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th><th>カテゴリ</th><th>氏名</th><th>メール</th>
        <th>内容</th><th>ステータス</th><th>操作</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="c : ${contacts}">
        <td th:text="${c.id}"></td>
        <td th:text="${c.category}"></td>
        <td th:text="${c.name}"></td>
        <td th:text="${c.email}"></td>
        <td th:text="${c.message}"></td>
        <td>
          <span class="status"
                th:classappend="${c.status == 'UNREAD'} ? 'status-unread' : 'status-read'"
                th:text="${c.status}"></span>
        </td>
        <td>
          <form class="inline" th:action="@{/admin/contacts/{id}/status(id=${c.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <select name="status">
              <option value="UNREAD" th:selected="${c.status == 'UNREAD'}">UNREAD</option>
              <option value="READ" th:selected="${c.status == 'READ'}">READ</option>
            </select>
            <button class="small" type="submit">更新</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>
</main>
</body>
</html>
