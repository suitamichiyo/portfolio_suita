# ===== アプリケーション基本設定 =====
spring.application.name=inimu

# ===== データベース設定（環境変数で切り替え） =====
# 本番（Render）: DATABASE_URL環境変数が設定される
# 開発: H2インメモリ使用
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:inimu;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# ===== H2設定（開発用） =====
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console
spring.sql.init.mode=${SQL_INIT_MODE:always}

# ===== MyBatis設定 =====
mybatis.configuration.map-underscore-to-camel-case=true

# ===== メール設定 =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:test@example.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8
app.mail.dev-mode=${MAIL_DEV_MODE:true}
app.mail.from=${MAIL_FROM:noreply@inimu.jp}
app.mail.admin=${MAIL_ADMIN:info@inimu.jp}

# ===== 管理者設定 =====
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:inimu2026}

# ===== サーバー設定 =====
server.port=${PORT:8080}
